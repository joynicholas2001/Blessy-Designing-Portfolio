<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>John Rainhard Blessy — Creative Designer | 5+ Years Experience</title>
    <meta name="description" content="Portfolio of John Rainhard Blessy, a Senior Creative Designer specialising in Branding, Graphic Design, Social Media Creatives & Digital Solutions." />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="John Rainhard Blessy — Creative Designer" />
    <meta property="og:description" content="Senior Creative Designer | Branding · Graphic Design · Social Media Creatives · Digital Solutions" />
    <meta property="og:image" content="/images/profile_photo.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Google Fonts — preconnect first for faster DNS + TLS handshake,
      then preload the CSS, then load with font-display=swap so text
      renders immediately with a fallback font (no render-blocking).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      onload="this.rel='stylesheet'"
    />
    <!-- Noscript fallback for browsers without JS -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
